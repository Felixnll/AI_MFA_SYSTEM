<!DOCTYPE html>
<html>
<head>
    <title>Securoserv Main Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman';
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: black;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .risk-line {
            margin-bottom: 14px;
        }

        .risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-low {
            background: #e7f7ec;
            color: #1e7a3b;
        }

        .risk-medium {
            background: #fff4db;
            color: #9a6700;
        }

        .risk-high {
            background: #fde8e8;
            color: #b42318;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 30px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        form {
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>Welcome, {{ username }}! 👋</h1>
    <p class="risk-line">Risk level during login: <span class="risk-badge risk-{{ risk_level|lower }}">{{ risk_level|capitalize }}</span></p>
    <p>PROJECT: AI/ML-ENHANCED MULTI-FACTOR AUTHENTICATION TO MITIGATE PASSWORD GUESSING ATTACKS</p>

    <div class="button-container">
        <form action="/logout" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>



</body>
</html>
